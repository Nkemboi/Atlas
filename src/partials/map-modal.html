<!-- Map location overlay -->
<div class="map-overlay" id="mapOverlay" role="dialog" aria-modal="true" aria-labelledby="mapTitle">
  <div class="map-panel">
    <button type="button" class="map-close" id="mapClose" aria-label="Close map">×</button>
    <div class="map-header">
      <div class="mono">Find us</div>
      <h3 id="mapTitle">Atlas Auto Service Centre</h3>
      <p>Thika Road, Exit 7 · opposite Garden City Mall, Nairobi</p>
    </div>
    <div class="map-frame">
      <!-- OpenStreetMap embed (demo / no API key) — Garden City Mall / Thika Road area -->
      <iframe
        title="Atlas Auto Service Centre location"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        src="https://www.openstreetmap.org/export/embed.html?bbox=36.8700%2C-1.2350%2C36.8950%2C-1.2150&amp;layer=mapnik&amp;marker=-1.2250%2C36.8825">
      </iframe>
    </div>
    <div class="map-actions">
      <a class="map-primary" href="https://maps.app.goo.gl/3VVAVvx3FgYUzrfz8" target="_blank" rel="noopener">Open in Google Maps</a>
      <a class="map-secondary" href="https://maps.app.goo.gl/3VVAVvx3FgYUzrfz8" target="_blank" rel="noopener">Open in OpenStreetMap</a>
    </div>
  </div>
</div>
